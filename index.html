<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해부생리 카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 열짜리 학습 도구. 홈(오늘 할 양, 범위) → 카드 한 장씩 → 결과. 방사선 필름처럼 차분한 청회색 바탕에 청록 포인트. */
:root{
  --bg:#EDF1F0;
  --surface:#FFFFFF;
  --ink:#15242A;
  --muted:#586A70;
  --line:#D2DAD9;
  --accent:#0D6770;
  --accent-ink:#FFFFFF;
  --good:#2C7A4B;
  --bad:#B1412A;
  --warn-bg:#FFF2D2;
  --warn-ink:#6A4900;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1316;--surface:#151E22;--ink:#E4ECEA;--muted:#93A3A6;--line:#263339;
    --accent:#5DC3CC;--accent-ink:#06191C;--good:#6FCB8F;--bad:#F08A6E;--warn-bg:#2E2610;--warn-ink:#F2D58A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1316;--surface:#151E22;--ink:#E4ECEA;--muted:#93A3A6;--line:#263339;
  --accent:#5DC3CC;--accent-ink:#06191C;--good:#6FCB8F;--bad:#F08A6E;--warn-bg:#2E2610;--warn-ink:#F2D58A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.5rem;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:.8rem;margin:0 0 10px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--font-mono);font-size:1.6rem;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:.9rem;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.row label{font-size:.9rem;color:var(--muted)}
select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:40px}
.switch{display:flex;gap:10px;align-items:center;font-size:.95rem}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

.btn{border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:52px;padding:10px 18px;font-weight:700;font-size:1rem;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;font-weight:500;color:var(--muted);min-height:44px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--bg)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:.9rem;color:var(--muted)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .btn{width:auto;min-height:40px;padding:6px 14px;font-weight:500}
.count{font-family:var(--font-mono);font-size:.9rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-height:260px}
.meta{font-family:var(--font-mono);font-size:.75rem;color:var(--muted);letter-spacing:.02em}
.q{font-size:1.3rem;line-height:1.5;font-weight:500;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.ans{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
.ans .lbl{font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.ans p{font-size:1.02rem}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;font-size:.9rem}

.big{font-family:var(--font-mono);font-size:2.2rem;font-variant-numeric:tabular-nums}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .stat b.g{color:var(--good)}
.sum .stat b.r{color:var(--bad)}
.foot{font-size:.8rem;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;min-height:48px;font-size:1rem;line-height:1.4;overflow-wrap:anywhere;width:100%}
.choice:hover:not([disabled]){border-color:var(--accent)}
.choice.ok{border-color:var(--good);background:var(--good);color:var(--bg);font-weight:700}
.choice.no{border-color:var(--bad);color:var(--bad);font-weight:700}
.choice[disabled]{cursor:default}

.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cta .btn.wide{grid-column:1/-1}
.btn small{display:block;font-weight:400;font-size:.8rem;opacity:.85;margin-top:2px}
.dday{font-family:var(--font-mono);font-size:.85rem;color:var(--accent);font-weight:500}
.last{font-size:.9rem;color:var(--muted)}
.hist{font-size:.8rem;color:var(--muted)}
.learnbadge{align-self:flex-start;background:var(--warn-bg);color:var(--warn-ink);border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:700}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="dday" id="dday"></div>
    <h1>해부생리 카드</h1>
    <p class="sub" id="subline"></p>
  </header>

  <section id="home" class="wrap" style="gap:16px">
    <p class="last" id="lastinfo"></p>
    <div class="stats" aria-label="오늘 현황">
      <div class="stat"><b id="n-due">0</b><span>복습할 카드</span></div>
      <div class="stat"><b id="n-new">0</b><span>오늘 새 카드</span></div>
      <div class="stat"><b id="n-wrong">0</b><span>틀린 카드</span></div>
    </div>

    <div class="panel">
      <div class="cta">
        <button class="btn primary wide" id="b-new">새로 외우기</button>
        <button class="btn" id="b-review">복습</button>
        <button class="btn" id="b-wrong">틀린 카드</button>
        <button class="btn wide" id="b-exam">확인 시험 (5지선다)</button>
        <button class="btn ghost wide" id="b-final">전체 섞어서 마무리 복습</button>
      </div>
      <p class="msg" id="homemsg"></p>
    </div>

    <div class="panel">
      <div>
        <h2>범위</h2>
        <div class="chips" id="chips"></div>
      </div>
      <div class="row">
        <label for="newlimit">하루 새 카드</label>
        <select id="newlimit">
          <option value="15">15장</option>
          <option value="25">25장</option>
          <option value="40">40장</option>
          <option value="999">전부</option>
        </select>
      </div>
    </div>

    <p class="foot">새로 외우기는 답을 읽고 외운 뒤 5장씩 바로 확인해요. 복습은 맞히면 1일, 3일, 7일 간격으로 다시 나오고, 틀리면 답을 다시 읽은 뒤 3~4장 뒤에 한 번 더 나와요. 확인 시험은 이미 본 카드로만 내고, 틀린 카드는 틀린 카드에 들어가요. 기록은 이 기기의 브라우저에만 저장돼요. 스누국시 해부생리학편을 개인 학습용으로 줄여 만든 카드라서 다른 사람과 공유하지 마세요.</p>
    <button class="btn ghost" id="reset">기록 지우기</button>
  </section>

  <section id="study" class="wrap" style="gap:14px" hidden>
    <div class="topbar">
      <button class="btn" id="quit">그만하기</button>
      <span class="count" id="count"></span>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="card" id="card">
      <span class="learnbadge" id="badge" hidden>읽고 외우기</span>
      <div class="meta" id="qmeta"></div>
      <div class="q" id="qtext"></div>
      <div class="choices" id="choices" hidden></div>
      <div class="ans" id="awrap" hidden>
        <span class="lbl">정답</span>
        <div id="atext"></div>
        <div class="note" id="note" hidden></div>
      </div>
      <div class="hist" id="hist"></div>
    </div>
    <button class="btn primary" id="reveal">정답 보기</button>
    <div class="pair" id="grade" hidden>
      <button class="btn bad" id="wrongbtn">틀렸어 / 헷갈려</button>
      <button class="btn good" id="rightbtn">맞혔어</button>
    </div>
  </section>

  <section id="done" class="wrap" style="gap:16px" hidden>
    <div class="panel">
      <h2 id="donetitle">오늘 세션 끝</h2>
      <div class="big" id="donebig"></div>
      <div class="sum">
        <div class="stat"><b class="g" id="s-right">0</b><span>맞힘</span></div>
        <div class="stat"><b class="r" id="s-wrong">0</b><span>틀림</span></div>
      </div>
      <p class="msg" id="donemsg"></p>
      <button class="btn primary" id="again-wrong">틀린 카드 외우러 가기</button>
      <button class="btn" id="gohome">홈으로</button>
    </div>
  </section>
</main>

<script>

var CATS=["뼈·관절","근육·심장","혈관·혈액","신경·뇌","소화","호흡·비뇨","생식·호르몬","감각"];
var CARDS=[
/* 뼈·관절 */
{id:"b1",cat:"뼈·관절",n:5,y:"23",q:"코곁굴(PNS)을 이루는 4개의 굴은?",a:"이마굴 · 위턱굴 · 나비굴 · 벌집굴\n이 중 위턱굴이 가장 크고 염증이 많이 생김"},
{id:"b2",cat:"뼈·관절",n:7,y:"21",q:"나비뼈에서 뇌하수체를 수용하는 곳은?",a:"안장(Sella turcica)\n나비뼈 몸통에 있고, 몸통에는 나비굴도 있음"},
{id:"b3",cat:"뼈·관절",n:7,y:"21",q:"나비뼈 큰날개의 구멍 3개는?",a:"원형구멍: 위턱신경\n타원구멍: 아래턱신경\n중간뇌막동맥구멍"},
{id:"b4",cat:"뼈·관절",n:7,y:"21",q:"시각신경이 지나는 나비뼈의 관은?",a:"작은날개의 시신경관"},
{id:"b5",cat:"뼈·관절",n:8,y:"22",q:"턱관절을 이루는 구조는?",a:"관자뼈 + 아래턱뼈 + 턱관절오목"},
{id:"b6",cat:"뼈·관절",n:10,y:"22·23",q:"관상봉합을 이루는 뼈는?",a:"마루뼈 + 이마뼈"},
{id:"b7",cat:"뼈·관절",n:10,y:"22·23",q:"비늘봉합을 이루는 뼈는?",a:"마루뼈 + 관자뼈"},
{id:"b8",cat:"뼈·관절",n:10,y:"22·23",q:"시옷봉합과 시상봉합을 이루는 뼈는?",a:"시옷봉합: 마루뼈 + 뒤통수뼈\n시상봉합: 마루뼈 + 마루뼈"},
{id:"b9",cat:"뼈·관절",n:12,y:"24",q:"뇌 속 신경다발과 혈관이 척주관으로 내려가도록 뒤통수뼈에 나 있는 큰 구멍은?",a:"큰구멍(foramen magnum)"},
{id:"b10",cat:"뼈·관절",n:15,y:"21",q:"척주굽이의 전만과 후만은 각각 어디이고, 선천·후천 중 무엇인가?",a:"전만: 목굽이(생후 3개월), 허리굽이(생후 12개월), 후천적\n후만: 등굽이, 엉치굽이, 선천적"},
{id:"b11",cat:"뼈·관절",n:17,y:"25",q:"가슴우리를 이루는 뼈와 개수는?",a:"복장뼈 1개\n등뼈(가슴척추) 12개\n갈비뼈 12쌍"},
{id:"b12",cat:"뼈·관절",n:25,y:"23·24",q:"관절 3종류와 대표 예는?",a:"섬유관절: 봉합, 못박이관절, 인대결합\n연골관절: 섬유연골결합(두덩결합, 척추사이원반), 유리연골결합(성장판)\n윤활관절: 나머지 대부분(척추, 손목, 발목, 어깨 등)"},
{id:"b13",cat:"뼈·관절",n:28,y:"21",q:"발목관절을 이루는 뼈는?",a:"정강이뼈 · 종아리뼈 · 목말뼈"},
/* 근육·심장 */
{id:"m1",cat:"근육·심장",n:33,y:"21",q:"심장근의 특징은?",a:"가로무늬근, 제대로근(불수의근)\n핵이 중앙에 1개\n사이원반, 자동성"},
{id:"m2",cat:"근육·심장",n:33,y:"21",q:"평활근의 특징은?",a:"민무늬근, 제대로근(불수의근)\n핵이 중앙에 1개(방추상)\n자율신경의 지배\n혈관은 평활근"},
{id:"m3",cat:"근육·심장",n:33,y:"21",q:"뼈대근의 특징은?",a:"가로무늬근, 맘대로근(수의근)\n핵이 여러 개\n수축물질: 아세틸콜린"},
{id:"m4",cat:"근육·심장",n:37,y:"25",q:"가로막의 세 구멍과 통과 구조는?",a:"대정맥구멍: 아래대정맥, 오른쪽 가로막신경\n식도구멍: 식도, 미주신경\n대동맥구멍: 내림대동맥, 가슴림프관, 홀정맥"},
{id:"m5",cat:"근육·심장",n:39,y:"23",q:"심장에서 가장 두꺼운 곳과, 심장에 혈액을 공급하는 혈관은?",a:"가장 두꺼운 곳: 왼심실\n혈액 공급: 심장동맥(Coronary artery)\n조절중추는 숨뇌, 무게는 250~350g"},
{id:"m6",cat:"근육·심장",n:39,y:"23",q:"심장막과 심장벽은 각각 무엇으로 이루어지나?",a:"심장막: 벽쪽심장막 + 섬유심장막\n심장벽: 심장바깥막, 심장근육층, 심장속막"},
{id:"m7",cat:"근육·심장",n:40,y:"22",q:"심장의 자극전도 경로는?",a:"굴심방결절(심박의 시작, pace maker) → 방실결절(굴심방결절의 역할 대행 가능) → 방실다발 → 심장전도근육섬유"},
{id:"m8",cat:"근육·심장",n:53,y:"21",q:"소순환(허파순환) 경로는?",a:"우심방 → 우심실 → 허파동맥 → 폐의 모세혈관 → 허파정맥 → 좌심방 → 좌심실"},
/* 혈관·혈액 */
{id:"v1",cat:"혈관·혈액",n:56,y:"24",q:"복강동맥의 세 가지와 공급 장기는?",a:"왼위동맥: 위, 식도\n온간동맥: 간, 쓸개\n지라동맥: 지라, 이자\n복강동맥은 복부동맥 중 가장 큼"},
{id:"v2",cat:"혈관·혈액",n:59,y:"25",q:"문맥순환의 경로와 특징은?",a:"위정맥, 지라정맥, 위창자간막정맥, 아래창자간막정맥 → 간문맥 → 간정맥 → 아래대정맥\n모세혈관을 2번 거침(장기 1번, 간 1번)\n영양분이 많이 포함됨"},
{id:"v3",cat:"혈관·혈액",n:62,y:"22",q:"아래창자간막동맥(IMA)이 분포하는 곳은?",a:"가로잘록창자 뒤쪽 1/2, 내림잘록창자, 구불잘록창자, 곧창자"},
{id:"v4",cat:"혈관·혈액",n:63,y:"",q:"위창자간막동맥(SMA)이 분포하는 곳은?",a:"가로잘록창자 앞쪽 1/2, 오름잘록창자, 막창자, 작은창자 전체"},
{id:"v5",cat:"혈관·혈액",n:66,y:"21",q:"다리의 동맥 흐름은?",a:"온엉덩동맥 → 바깥엉덩동맥 → 넓다리동맥 → 오금동맥 → 앞정강동맥(→ 발등동맥) / 종아리동맥 / 뒤정강동맥(→ 발바닥동맥)\n속엉덩동맥은 골반 내 혈액 공급"},
{id:"v6",cat:"혈관·혈액",n:69,y:"25",q:"혈액의 구성 비율은?",a:"혈장 55% (액체)\n혈구 45% (백혈구, 적혈구, 혈소판)"},
{id:"v7",cat:"혈관·혈액",n:71,y:"24",q:"과립백혈구 3종의 기능은?",a:"호중구: 강한 식작용, 급성염증 시 증가\n호산구: 기생충 감염, 해독\n호염기구: 알레르기 반응, 혈액응고 방지"},
{id:"v8",cat:"혈관·혈액",n:71,y:"24",q:"무과립백혈구 2종의 기능은?",a:"단핵구: 강한 식작용, 만성염증 시 증가\n림프구: 면역"},
{id:"v9",cat:"혈관·혈액",n:72,y:"22",q:"적혈구 생성을 조절하는 호르몬과 분비 기관은?",a:"에리트로포이에틴, 콩팥에서 분비"},
{id:"v10",cat:"혈관·혈액",n:75,y:"23",q:"혈액응고의 마지막 단계는?",a:"피브리노겐 + 트롬빈 → 피브린(섬유소)"},
{id:"v11",cat:"혈관·혈액",n:83,y:"22·25",q:"산소를 운반하는 혈액 성분과 그 특징은?",a:"적혈구(헤모글로빈 포함)\n대부분의 세포와 달리 핵이 없음"},
{id:"v12",cat:"혈관·혈액",n:82,y:"23·24",q:"심전도의 P파, QRS 복합, T파는 각각 무엇을 나타내나?",a:"P파: 심방의 탈분극\nQRS 복합: 심실의 탈분극(심실 수축기)\nT파: 심실의 재분극(심실 이완기)"},
/* 신경·뇌 */
{id:"n1",cat:"신경·뇌",n:95,y:"22",q:"역치(문턱값) 이상의 자극에서만 반응이 나타나는 현상은?",a:"실무율의 법칙\n문턱값 이하에서는 활동전압이 일어나지 않음"},
{id:"n2",cat:"신경·뇌",n:96,y:"24",q:"피라미드가 교차하고 호흡, 심장, 소화기, 구토중추가 있는 중추화학수용기는?",a:"숨뇌"},
{id:"n3",cat:"신경·뇌",n:97,y:"21·24·25",q:"대뇌속질의 신경섬유 3종과 역할은?",a:"연합섬유: 같은 반구 안에서 다른 겉질 부위를 연결\n맞교차섬유: 좌우 반구를 연결, 가장 큰 것이 뇌들보\n투사섬유: 대뇌겉질과 말초를 연결"},
{id:"n4",cat:"신경·뇌",n:97,y:"21·24·25",q:"렌즈핵(바닥핵)이 손상되면 생기는 병은?",a:"파킨슨병\n바닥핵은 백색질 속에 섬처럼 있는 회색질 덩어리"},
{id:"n5",cat:"신경·뇌",n:98,y:"22·24",q:"브로카 영역과 베르니케 영역의 위치와 기능은?",a:"브로카: 중심앞이랑(운동영역), 운동성 언어영역(발음)\n베르니케: 중심뒤이랑(감각영역), 감각성 언어영역(손상 시 말뜻을 이해 못함)\n중심고랑은 이마엽(운동)과 마루엽(감각)의 경계"},
{id:"n6",cat:"신경·뇌",n:98,y:"",q:"관자엽과 뒤통수엽은 각각 어떤 중추를 가지나?",a:"관자엽: 청각중추\n뒤통수엽: 시각중추"},
{id:"n7",cat:"신경·뇌",n:99,y:"23",q:"혈당, 체온, 식욕, 체액균형, 배란, 호르몬 조절을 맡는 자율신경계의 통합중추는?",a:"시상하부(사이뇌)"},
{id:"n8",cat:"신경·뇌",n:100,y:"23",q:"반사활의 순서는?",a:"수용기(감각기) → 감각세포(들신경) → 반사중추(척수속질) → 운동세포(날신경) → 효과기(반응기)"},
{id:"n9",cat:"신경·뇌",n:105,y:"25",q:"대뇌반구와 사이뇌를 싸는 겉질 영역으로, 정서·충동·학습·기억과 관계된 신경계통은?",a:"둘레계통(가장자리계통)"},
{id:"n10",cat:"신경·뇌",n:108,y:"21",q:"뇌신경 12쌍을 순서대로 말하면?",a:"1 후각 · 2 시각 · 3 눈돌림 · 4 도르래 · 5 삼차 · 6 갓돌림 · 7 얼굴 · 8 속귀 · 9 혀인두 · 10 미주 · 11 더부 · 12 혀밑"},
{id:"n11",cat:"신경·뇌",n:108,y:"21",q:"부교감신경 성분을 가진 뇌신경 4개는?",a:"3 눈돌림 · 7 얼굴 · 9 혀인두 · 10 미주\n얼굴신경: 혀 앞 2/3 미각, 혀밑샘·턱밑샘 분비\n혀인두신경: 혀 뒤 1/3 미각, 귀밑샘 분비"},
{id:"n12",cat:"신경·뇌",n:113,y:"23",q:"교감신경과 부교감신경의 시작 부위와 신경절 위치는?",a:"교감: 가슴척수·허리척수에서 시작, 신경절 이전이 짧고 이후가 김\n부교감: 뇌·엉치척수에서 시작, 신경절 이후가 짧고 이전이 김"},
{id:"n13",cat:"신경·뇌",n:113,y:"23",q:"교감신경과 부교감신경의 신경물질과 기능은?",a:"교감: 신경절 이전 아세틸콜린, 이후 노르에피네프린 / 심장기능 촉진, 동공 확장\n부교감: 이전·이후 모두 아세틸콜린 / 소화기능·침분비 촉진, 동공 축소"},
/* 소화 */
{id:"d1",cat:"소화",n:117,y:"24",q:"위세포 5종과 분비물은?",a:"벽세포: HCl + 내인자(비타민 B12와 결합, 결핍 시 악성빈혈)\n으뜸세포: 펩시노겐\n점액목세포: 뮤코스(점액)\nD세포: 소마토스타틴(위산분비 억제)\nG세포: 가스트린(위산분비 촉진)"},
{id:"d2",cat:"소화",n:120,y:"22·25",q:"이자의 호르몬과 소화효소는?",a:"알파세포: 글루카곤(혈당 올림)\n베타세포: 인슐린(혈당 낮춤)\n델타세포: 소마토스타틴\n아밀라아제: 탄수화물 / 리파아제: 지방 / 트립신: 단백질 소화"},
{id:"d3",cat:"소화",n:125,y:"21·25",q:"식도의 위치와 생리적 협착부는?",a:"인두와 위를 연결하는 약 25cm의 근육성 관, 기관 뒤쪽에 위치\n협착부: 입구부 C5~6, 기관분지부(Carina) T5, 식도구멍(가로막 통과) T10\n상피: 중층편평상피"},
{id:"d4",cat:"소화",n:135,y:"23",q:"큰창자의 구조와 연결 순서는?",a:"막창자 → 잘록창자(오름 → 가로 → 내림 → 구불) → 곧창자(직장)"},
{id:"d5",cat:"소화",n:136,y:"22·24",q:"작은창자의 특징과 운동은?",a:"돌림주름(가장 안쪽 점막층), 융모 발달, 림프조직 발달, Brunner's gland\n운동: 융모운동, 꿈틀운동, 분절운동, 진자운동"},
{id:"d6",cat:"소화",n:136,y:"22·24",q:"큰창자의 특징과 운동은?",a:"반달주름, 잘록창자띠, 복막주렁, 잘록창자팽대\n운동: 팽기수축, 역연동운동(거꿀꿈틀운동), 집단수축운동(위-대장반사)"},
/* 호흡·비뇨 */
{id:"r1",cat:"호흡·비뇨",n:144,y:"25",q:"호흡기계의 순서는?",a:"후두 → 기관 → 기관지 → 종말세기관지 → 호흡세기관지 → 허파꽈리"},
{id:"r2",cat:"호흡·비뇨",n:146,y:"21·24",q:"들숨과 날숨에서 갈비뼈, 가로막, 가슴안, 가슴안압력, 허파는 어떻게 변하나?",a:"들숨: 갈비뼈 상승, 가로막 수축(하강), 가슴안 넓어짐, 압력 감소, 허파 팽창, 공기 밖 → 안\n날숨: 갈비뼈 하강, 가로막 이완(상승), 가슴안 좁아짐, 압력 증가, 허파 수축, 공기 안 → 밖"},
{id:"r3",cat:"호흡·비뇨",n:150,y:"23",q:"혈액 속 CO₂는 주로 어떤 형태로 운반되나?",a:"중탄산이온(HCO₃⁻)"},
{id:"r4",cat:"호흡·비뇨",n:152,y:"21·25",q:"기관지가 갈라지는 순서와 허파꽈리까지의 경로는?",a:"일차기관지 → 이차(엽)기관지 → 삼차(구역)기관지 → 세기관지 → 종말세기관지 → 호흡세기관지 → 허파꽈리관 → 허파꽈리주머니 → 허파꽈리\n종말세기관지까지는 공기 통로 역할, 호흡세기관지부터 실제 호흡에 관여"},
{id:"r5",cat:"호흡·비뇨",n:154,y:"22",q:"허파꽈리 1형·2형 세포의 역할은?",a:"1형: 면적의 95%를 차지, 가스교환이 일어남(호흡상피세포)\n2형: 계면활성제 분비, 재생"},
{id:"r6",cat:"호흡·비뇨",n:153,y:"24",q:"가슴세로칸 세 구역에 들어 있는 구조는?",a:"위세로칸: 기관, 대동맥, 식도, 위대정맥\n중간세로칸: 심장\n뒤세로칸: 대동맥, 식도, 가슴림프관\n(복장뼈 자루와 몸통의 경계를 기준으로 나눔)"},
{id:"r7",cat:"호흡·비뇨",n:157,y:"25",q:"방광의 구조적 특징은?",a:"근육과 주름이 발달\n요관과 요도를 연결하는 방광삼각이 있고, 이 부분에는 주름이 없음\n이행상피조직\n속이 빈 공동기관, 골반강(복막 외)에 위치"},
{id:"r8",cat:"호흡·비뇨",n:159,y:"24",q:"콩팥의 겉질과 속질에는 각각 무엇이 있나?",a:"겉질: 토리, 토리주머니, 토리쪽곱슬세관, 먼쪽곱슬세관\n속질: 콩팥세관고리, 집합세관"},
{id:"r9",cat:"호흡·비뇨",n:161,y:"21·23·24",q:"소변 형성 3단계는?",a:"1 토리여과: 토리압 > 토리주머니압\n2 세관 재흡수\n3 세관 재분비"},
{id:"r10",cat:"호흡·비뇨",n:161,y:"21·23·24",q:"토리쪽곱슬세관에서 재흡수되는 물질과 비율은?",a:"포도당, 아미노산, 칼륨(K⁺): 100%\n나트륨(Na⁺), 물: 약 80%"},
{id:"r11",cat:"호흡·비뇨",n:161,y:"21·23·24",q:"먼쪽곱슬세관과 집합세관의 재흡수(약 20%)는 어떤 호르몬이 조절하나?",a:"나트륨: 알도스테론\n물: 항이뇨호르몬(ADH)"},
{id:"r12",cat:"호흡·비뇨",n:161,y:"21·23·24",q:"세관에서 재분비되는 물질은 어디서 분비되나?",a:"토리쪽곱슬세관: H⁺, NH₃, Creatinine, PAH\n먼쪽곱슬세관: K⁺, H⁺, NH₃"},
{id:"r13",cat:"호흡·비뇨",n:165,y:"25",q:"토리여과율(GFR) 측정에 쓰는 물질은?",a:"이눌린(Inulin)\n재흡수도 재분비도 되지 않음"},
/* 생식·호르몬 */
{id:"h1",cat:"생식·호르몬",n:166,y:"21",q:"정자와 난자의 생성 과정은?",a:"고환: 정조세포 → 1차 정모세포 → 2차 정모세포 → 정자세포 → 정자 4개\n난소: 난조세포 → 1차 난모세포 → 2차 난모세포 → 난자 1개 + 극체 3개"},
{id:"h2",cat:"생식·호르몬",n:167,y:"24",q:"정자의 이동경로는?",a:"정세관 → 부고환 → 정관 → 사정관 → 요도\n정세관은 고환에서 정자를 만드는 시작점"},
{id:"h3",cat:"생식·호르몬",n:172,y:"23",q:"요도와 사정관이 만나는(열리는) 부분은?",a:"전립샘(전립선)"},
{id:"h4",cat:"생식·호르몬",n:174,y:"21",q:"에스트로겐과 프로게스테론의 기능은?",a:"에스트로겐: 자궁내막 증식, 난자 성숙, 2차성징, 성숙난포에서 분비\n프로게스테론: 자궁내막을 두껍게 만듦, 황체에서 분비"},
{id:"h5",cat:"생식·호르몬",n:175,y:"22·23·25",q:"월경주기의 순서와 각 시기의 호르몬은?",a:"월경기(기능층 탈락) → 여포기·증식기(에스트로겐) → 배란 → 황체기·분비기(프로게스테론) → 다음 월경\n총 28일"},
{id:"h6",cat:"생식·호르몬",n:177,y:"22·23",q:"뇌하수체 앞엽에서 나오는 호르몬은?",a:"GH(성장호르몬), ACTH(부신겉질자극), TSH(갑상샘자극), FSH(난포자극), LH(황체형성), PRL(프로락틴: 임신 중 유방 발달과 유즙 생산)"},
{id:"h7",cat:"생식·호르몬",n:177,y:"22·23",q:"뇌하수체 중간엽과 뒤엽에서 나오는 호르몬은?",a:"중간엽: MSH(멜라닌세포자극호르몬)\n뒤엽: ADH(항이뇨호르몬), 옥시토신(자궁수축호르몬)"},
{id:"h8",cat:"생식·호르몬",n:178,y:"22·25",q:"칼시토닌과 부갑상샘호르몬(파라토르몬)의 작용은?",a:"칼시토닌: 혈중 칼슘농도 감소\n부갑상샘호르몬: 혈중 칼슘농도 증가(표적기관 뼈·콩팥, 비타민 D와 관련)\n서로 균형을 맞춤"},
{id:"h9",cat:"생식·호르몬",n:178,y:"22",q:"티록신은 무엇과 관련되고 누구의 지배를 받나?",a:"기초대사율과 관련\n뇌하수체의 지배(TSH)"},
{id:"h10",cat:"생식·호르몬",n:182,y:"25",q:"갑상샘 호르몬의 주요 구성 성분은?",a:"요오드",note:"확인 필요: 스누국시 182번에는 '칼슘'으로 적혀 있어요. 갑상샘 호르몬은 요오드를 포함하고 칼슘·인 대사는 부갑상샘이 맡기 때문에 원문 오타로 보여요. 원문 그대로 외우지 말고 확인해 두세요."},
{id:"h11",cat:"생식·호르몬",n:182,y:"25",q:"칼슘과 인의 대사와 관련된 내분비 기관은?",a:"부갑상샘"},
{id:"h12",cat:"생식·호르몬",n:183,y:"23",q:"부신겉질 호르몬 3종과 작용은?",a:"알도스테론: Na 흡수\n코르티솔: 당 대사\n안드로겐: 성호르몬\n뇌하수체 ACTH의 지배를 받음"},
{id:"h13",cat:"생식·호르몬",n:185,y:"24",q:"부신속질에서 분비하는 호르몬은?",a:"에피네프린, 노르에피네프린\n교감신경의 지배를 받음\n부신은 콩팥 바로 위에 있는 한 쌍의 내분비 기관"},
/* 감각 */
{id:"s1",cat:"감각",n:190,y:"21·22·25",q:"평형감각과 청각에서 뼈미로와 막미로는 각각 무엇인가?",a:"평형: 뼈미로 = 안뜰, 막미로 = 타원주머니\n회전 평형: 뼈미로 = 반고리뼈관(신체평형), 막미로 = 반고리관\n청각: 뼈미로 = 달팽이, 막미로 = 달팽이관(나선기관)"},
{id:"s2",cat:"감각",n:193,y:"22·24·25",q:"안구벽 섬유막층의 각막과 공막은 어떻게 다른가?",a:"각막: 안구 앞쪽의 투명하고 혈관 없는 조직, 눈 보호와 빛 굴절(검은자)\n공막: 안구 뒤쪽 5/6를 이루는 흰색막(흰자)"},
{id:"s3",cat:"감각",n:193,y:"22·24·25",q:"혈관막층의 맥락막, 홍채, 섬모체의 역할은?",a:"맥락막: 빛을 흡수하는 암막 역할(시각적 혼란 방지)\n홍채: 멜라닌 색소로 눈의 색을 결정, 동공 형성\n섬모체: 수정체 두께 조절"},
{id:"s4",cat:"감각",n:193,y:"22·24·25",q:"망막의 맹점과 황반은 각각 무엇인가?",a:"맹점: 시각신경원반(상이 잘 안 맺힘)\n황반: 중심오목(상이 잘 맺힘)\n굴절질: 안방수, 수정체, 초자체"},
{id:"s5",cat:"감각",n:225,y:"22",q:"성대가 있어 소리상자(voice box)라고 불리는 기관은?",a:"후두(larynx)"},
{id:"s6",cat:"감각",n:226,y:"22",q:"이행상피가 있는 기관과 특징은?",a:"방광, 요도, 요관\n보호 기능, 잘 늘어나는 확장성"},
{id:"s7",cat:"감각",n:227,y:"23",q:"입 안 점막에서 감각상피 형태로 분포하는 미각기관은?",a:"맛봉오리"},
{id:"B01",cat:"뼈·관절",n:1,y:"",q:"뇌머리뼈(8개)와 개수는?",a:"이마뼈 1 · 나비뼈 1 · 관자뼈 2 · 마루뼈 2 · 뒤통수뼈 1 · 벌집뼈 1"},
{id:"B02",cat:"뼈·관절",n:2,y:"",q:"얼굴뼈(14개)와 개수는?",a:"코뼈 2 · 눈물뼈 2 · 위턱뼈 2 · 아래턱뼈 1 · 입천장뼈 2 · 아래코선반뼈 2 · 광대뼈 2 · 보습뼈 1"},
{id:"B03",cat:"뼈·관절",n:3,y:"",q:"이마뼈, 마루뼈, 뒤통수뼈, 어깨뼈, 갈비뼈, 복장뼈를 모양으로 분류하면?",a:"납작뼈"},
{id:"B04",cat:"뼈·관절",n:4,y:"",q:"이마뼈, 위턱뼈, 나비뼈, 벌집뼈, 관자뼈의 공통점은?",a:"공기뼈(속에 굴이 있음)"},
{id:"B05",cat:"뼈·관절",n:6,y:"",q:"막뼈되기와 연골뼈되기에 해당하는 뼈는? 가장 먼저 뼈되기가 되는 곳은?",a:"막뼈되기: 납작뼈에 해당(머리뼈, 빗장뼈, 엉덩뼈)\n연골뼈되기: 납작뼈를 제외한 나머지\n가장 먼저 뼈되기가 되는 곳: 빗장뼈(Clavicle)"},
{id:"B06",cat:"뼈·관절",n:8,y:"22",q:"관자뼈(temporal bone)의 구성 4부분은?",a:"비늘부분: 광대활(관자뼈+광대뼈), 턱관절\n꼭지부분: 꼭지돌기, 속에 꼭지벌집(공기), 중이와 연결\n고실부분: 귓속뼈(망치뼈, 모루뼈, 등자뼈)\n바위부분: 청각·평형감각기가 들어 있음"},
{id:"B07",cat:"뼈·관절",n:9,y:"",q:"눈확(orbit)을 이루는 7개의 뼈는?",a:"이마뼈 · 나비뼈 · 눈물뼈 · 입천장뼈 · 광대뼈 · 벌집뼈 · 위턱뼈\n정면에서 시신경구멍은 외측하부에 보임"},
{id:"B08",cat:"뼈·관절",n:11,y:"",q:"앞숫구멍과 뒤숫구멍은 어느 봉합이 만나고 언제 닫히나?",a:"앞숫구멍: 시상봉합+관상봉합 접합부, 생후 24개월 후 폐쇄(가장 늦음)\n뒤숫구멍: 시상봉합+시옷봉합 접합부, 생후 3개월 후 폐쇄(가장 빠름)"},
{id:"B09",cat:"뼈·관절",n:11,y:"",q:"앞가쪽 숫구멍과 뒤가쪽 숫구멍은?",a:"앞가쪽: 비늘봉합 + 관상봉합 접합부\n뒤가쪽: 비늘봉합 + 시옷봉합 접합부"},
{id:"B10",cat:"뼈·관절",n:13,y:"",q:"코안의 선반뼈 3쌍과 코중격을 이루는 뼈는?",a:"위·중간 코선반: 벌집뼈(뇌머리뼈)\n아래 코선반: 아래코선반뼈(얼굴뼈)\n코중격: 벌집뼈(위) + 보습뼈(아래)"},
{id:"B11",cat:"뼈·관절",n:14,y:"",q:"척주의 구성과 목뼈·등뼈·허리뼈의 특징은?",a:"척추뼈 26개 + 척추사이원반 23개\n목뼈(7개): 가로돌기에서 척추동맥·정맥이 지남, 가시돌기 끝이 갈라짐\n등뼈(12개): 가시돌기가 뾰족하고 길며 아래로 뻗음\n허리뼈(5개): 가시돌기가 짧고 두꺼우며 수평으로 뻗음"},
{id:"B12",cat:"뼈·관절",n:16,y:"",q:"척추뼈 몸통과 가시돌기를 볼 수 없는 목뼈는?",a:"첫 번째 목뼈(고리뼈, Atlas)"},
{id:"B13",cat:"뼈·관절",n:17,y:"25",q:"가슴우리의 특징과 갈비뼈 구분은?",a:"가슴안(흉강)을 만들고 호흡, 허파·심장·식도·기관을 보호\n1~7 참갈비뼈 / 8~10 거짓갈비뼈 / 11·12 뜬갈비뼈\n복장뼈에서 골수검사(표피에서 가장 가까운 적색골수)"},
{id:"B14",cat:"뼈·관절",n:18,y:"",q:"손목뼈 8개를 몸쪽(손목) 줄과 먼쪽(손끝) 줄로 말하면? (오른손, 새끼손가락 → 엄지)",a:"먼쪽(손끝): 갈고리뼈, 알머리뼈, 작은마름뼈, 큰마름뼈\n몸쪽(손목): 콩알뼈, 세모뼈, 반달뼈, 손배뼈\n(안쪽 새끼손가락 → 가쪽 엄지손가락)"},
{id:"B15",cat:"뼈·관절",n:18,y:"",q:"손목뼈 이름의 영어는?",a:"갈고리뼈 Hamate · 알머리뼈 Capitate · 작은마름뼈 Trapezoid · 큰마름뼈 Trapezium\n콩알뼈 Pisiform · 세모뼈 Triquetrum · 반달뼈 Lunate · 손배뼈 Scaphoid"},
{id:"B16",cat:"뼈·관절",n:18,y:"",q:"발목뼈(발배뼈 등)의 배열과 영어 이름은?",a:"먼쪽: 발허리뼈(Metatarsal), 쐐기뼈(Cuneiform, 안쪽·중간·가쪽), 입방뼈(Cuboid)\n발배뼈(Navicular) → 목말뼈(Talus) → 뒤꿈치뼈(Calcaneus)\n(발허리뼈 1·2·3은 쐐기뼈, 4·5는 입방뼈와 만남)"},
{id:"B17",cat:"뼈·관절",n:19,y:"",q:"세로 발바닥활과 가로 발바닥활은 어떤 뼈로 이루어지나?",a:"세로 안쪽: 뒤꿈치뼈 - 목말뼈 - 발배뼈 - 3개 쐐기뼈 - 1·2·3 발허리뼈\n세로 가쪽: 뒤꿈치뼈 - 입방뼈 - 4·5 발허리뼈\n가로: 3개 쐐기뼈 - 입방뼈"},
{id:"B18",cat:"뼈·관절",n:20,y:"",q:"볼기뼈(hip bone)를 이루는 3개 뼈는? 골반을 이루는 3개 뼈는?",a:"볼기뼈: 엉덩뼈(Ilium) · 두덩뼈(Pubis) · 궁둥뼈(Ischium)\n골반: 볼기뼈 · 엉치뼈(Sacrum) · 꼬리뼈(Coccyx)"},
{id:"B19",cat:"뼈·관절",n:22,y:"",q:"큰결절과 작은결절이 있는 뼈는?",a:"위팔뼈(Humerus)"},
{id:"B20",cat:"뼈·관절",n:23,y:"",q:"척추뼈 중 가장 크고 꼭지돌기(mamillary process)가 있는 뼈는?",a:"허리뼈(Lumbar)"},
{id:"B21",cat:"뼈·관절",n:24,y:"",q:"단단입천장(hard palate)을 이루는 머리뼈는?",a:"입천장뼈(Palatine bone) + 위턱뼈(Maxilla)"},
{id:"B22",cat:"뼈·관절",n:25,y:"",q:"경첩관절과 중쇠관절은 어떤 움직임이고 예는?",a:"경첩관절(hinge): 경첩 축에 직각으로 놓인 운동면 움직임, 위팔자관절(위팔뼈-자뼈)\n중쇠관절(pivot): 축 중심 회전운동, 고리뼈-중쇠뼈"},
{id:"B23",cat:"뼈·관절",n:25,y:"",q:"절구관절, 평면관절, 타원관절은 각각 무엇이고 예는?",a:"절구관절(ball and socket): 한 면 공모양, 다른 면 소켓, 어깨관절·엉덩관절(고관절)\n평면관절(plane): 평면에 가까워 축 없이 미끄럼 운동\n타원관절(ellipsoid): 타원형 관절면이 오목·볼록 짝, 손목관절·손가락관절"},
{id:"B24",cat:"뼈·관절",n:26,y:"",q:"척추사이관절(Disc)은? 척추원반 탈출 시 중요한 인대는?",a:"척추뼈 몸통 사이 관절(척추사이원반)\n뒤·세로 인대(후종인대)"},
{id:"B25",cat:"뼈·관절",n:28,y:"",q:"무릎관절을 이루는 뼈와 안정화 구조는?",a:"넙다리뼈(femur) + 무릎뼈(patella) + 정강뼈(tibia)\n안정화: 두 뼈 사이 섬유연골인 관절반달(meniscus)"},
{id:"B26",cat:"뼈·관절",n:28,y:"21",q:"어깨관절을 이루는 뼈는?",a:"위팔뼈(humerus) · 어깨뼈(scapula) · 빗장뼈(clavicle)"},
{id:"B27",cat:"뼈·관절",n:28,y:"",q:"팔꿈치관절을 이루는 뼈와 팔을 펴는 근육은?",a:"위팔뼈 · 노뼈(radius) · 자뼈(ulna)\n폄 근육: 위팔세갈래근(삼두)"},
{id:"B28",cat:"뼈·관절",n:28,y:"",q:"팔꿈치관절의 세 관절(위팔노관절, 위팔자관절, 노자관절)은?",a:"위팔노관절: 위팔뼈 작은머리 + 노뼈\n위팔자관절: 도르래(trochlear) + 도르래패임\n노자관절: 노뼈머리 & 자뼈패임(medial), 자뼈머리 & 노패임(lateral)"},
{id:"M01",cat:"근육·심장",n:29,y:"",q:"근육원섬유마디(sarcomere)의 범위와 A대·I대·H대는 무엇인가?",a:"근육원섬유마디: Z선에서 Z선까지(actin 끝에서 actin 끝까지), 가장 작은 단위\nA대(암대): 가운데 myosin 부분\nI대(명대): actin만 있는 부분(myosin 끝부분 사이)\nH대: A대 안에서 밝은 부분(myosin만 있는 곳, actin과 겹치지 않음)"},
{id:"M02",cat:"근육·심장",n:30,y:"",q:"근육이 수축할 때 A대, I대, H대, 근육원섬유마디, 필라멘트의 길이는 어떻게 변하나?",a:"A대: 변화 없음\nI대: 짧아짐\nH대: 짧아짐\n근육원섬유마디(Z-Z): 짧아짐\n필라멘트: 변화 없음\n(actin과 myosin이 서로 미끄러져 들어가는 활주설)"},
{id:"M03",cat:"근육·심장",n:30,y:"",q:"뼈대근을 이루는 단백질과 역할은?",a:"myosin(굵은 필라멘트): ATP 분해\nactin(가는 필라멘트): myosin과 결합(Ca 필요)\ntroponin: 칼슘과 결합\ntropomyosin: myosin과 actin의 결합을 방해"},
{id:"M04",cat:"근육·심장",n:31,y:"",q:"뼈대근 수축 시 에너지 공급원 3가지는?",a:"1 직접 에너지원: ATP\n2 크레아틴인산의 분해\n3 포도당(젖산 생성+에너지)\n젖산 → 간 → 글리코겐 → 간 → 포도당"},
{id:"M05",cat:"근육·심장",n:32,y:"",q:"운동 후 몸에 생기는 변화는?",a:"젖산이 쌓인다 · 산소부채 증가 · 심장활동 증가"},
{id:"M06",cat:"근육·심장",n:34,y:"",q:"얼굴근육(표정근)에 해당하는 근육과 지배신경은?",a:"볼근, 입둘레근, 큰광대근, 작은광대근, 입꼬리당김근, 입꼬리내림근, 눈둘레근, 눈꺼풀올림근\n표정을 짓는 근육, 얼굴신경이 지배"},
{id:"M07",cat:"근육·심장",n:35,y:"",q:"눈꺼풀올림근을 지배하는 신경은?",a:"눈돌림신경"},
{id:"M08",cat:"근육·심장",n:36,y:"",q:"씹기근(저작근) 4개와 지배신경은?",a:"관자근, 깨물근, 안쪽날개근, 가쪽날개근\n아래턱신경이 지배"},
{id:"M09",cat:"근육·심장",n:38,y:"",q:"들숨근(들숨에 작용하는 근육)은?",a:"가로막 수축, 갈비올림근, 바깥갈비 사이근"},
{id:"M10",cat:"근육·심장",n:41,y:"",q:"심장판막 4개와 위치는?",a:"방실판막: 좌측 이첨판(승모판, mitral), 우측 삼첨판(tricuspid)\n반달판막: 허파동맥판막(우심실, pulmonary), 대동맥판막(좌심실, aortic)"},
{id:"M11",cat:"근육·심장",n:42,y:"",q:"오금근육(Hamstring)은 무엇이고 어떤 일을 하나?",a:"넙다리두갈래근, 반힘줄근, 반막근\n종아리굽힘과 넙다리폄에 사용, 궁둥신경이 지배"},
{id:"M12",cat:"근육·심장",n:43,y:"",q:"위팔을 굽히는 근육과 펴는 근육은?",a:"굽힘: 위팔두갈래근, 부리위팔근\n폄: 위팔세갈래근"},
{id:"M13",cat:"근육·심장",n:44,y:"",q:"어깨세모근(deltoid)의 작용과 이어주는 뼈는?",a:"위팔굽힘, 안쪽돌림, 가쪽돌림, 벌림의 주작용근(어깨운동의 주작용근)\n위팔근육주사 부위\n빗장뼈(Clavicle)와 어깨뼈(Scapula)를 이음"},
{id:"M14",cat:"근육·심장",n:45,y:"",q:"등세모근, 어깨올림근, 작은마름근, 큰마름근, 넓은등근의 공통점은?",a:"척주와 팔을 이어주는 근육"},
{id:"M15",cat:"근육·심장",n:46,y:"",q:"아래팔의 뒤쪽 근육을 지배하는 신경은?",a:"노신경(Radial nerve)"},
{id:"M16",cat:"근육·심장",n:47,y:"",q:"어깨세모근, 가시위근, 가시아래근, 큰원근, 작은원근, 어깨밑근이 분포한 곳은?",a:"어깨"},
{id:"M17",cat:"근육·심장",n:48,y:"",q:"인체에서 가장 긴 근육은?",a:"넙다리빗근"},
{id:"M18",cat:"근육·심장",n:49,y:"",q:"활동전압 없이 일어나는 비가역적 수축상태, 빠르게 일어나는 1회 수축과 이완, 천천히 힘을 줄 때 수축은 각각?",a:"비가역적 수축: 강직\n역치 이상의 단일 자극에 의한 1회 수축·이완: 연축\n천천히 힘을 줄 때 수축: 강축(지속수축)"},
{id:"M19",cat:"근육·심장",n:50,y:"",q:"엉덩갈비근, 등가장긴근, 등가시근이 이루는 근육은?",a:"척추세움근"},
{id:"M20",cat:"근육·심장",n:51,y:"",q:"넙다리네갈래근의 특징은?",a:"인체 최대 근육\n구성: 넙다리곧은근, 안쪽넓은근, 중간넓은근, 가쪽넓은근\n기능: 종아리폄, 무릎인대 형성, 넙다리신경이 지나감"},
{id:"V01",cat:"혈관·혈액",n:52,y:"",q:"대순환(온몸순환) 경로는?",a:"좌심실 → 대동맥 → 동맥 → 모세혈관 → 정맥 → 대정맥 → 우심방"},
{id:"V02",cat:"혈관·혈액",n:54,y:"",q:"대동맥활에서 직접 갈라지는 혈관 3개는?",a:"팔머리동맥(오른쪽) · 왼온목동맥 · 왼빗장밑동맥\n(흉부·복부대동맥에서 나가는 가지와 헷갈리지 말 것)"},
{id:"V03",cat:"혈관·혈액",n:55,y:"",q:"복부대동맥에서 직접 갈라지는 혈관 8개는?",a:"아래가로막동맥, 복강동맥(+3개 가지), 부신동맥, 위창자간막동맥(SMA), 콩팥동맥, 생식샘동맥, 아래창자간막동맥(IMA), 허리동맥"},
{id:"V04",cat:"혈관·혈액",n:57,y:"",q:"아래대정맥(IVC)의 곁순환로로 가슴·배의 혈액을 회수해 위대정맥(SVC)으로 보내는 혈관은?",a:"홀정맥(Azygos vein)"},
{id:"V05",cat:"혈관·혈액",n:58,y:"",q:"정상 성인의 혈압과 맥압은?",a:"혈압 120mmHg ~ 80mmHg\n맥압: 40mmHg(최고혈압 − 최저혈압)"},
{id:"V06",cat:"혈관·혈액",n:60,y:"",q:"태아 순환 중 유일한 동맥혈 혈관과 태아 특징은?",a:"동맥혈: 배꼽정맥\n태반에서 가스교환\n오른심방-왼심방 사이 구멍 = 타원구멍(출생 시 막히고 흔적은 타원오목, 안 막히면 청색아증)"},
{id:"V07",cat:"혈관·혈액",n:61,y:"",q:"인체에서 가장 큰 혈관은?",a:"아래대정맥(IVC)"},
{id:"V08",cat:"혈관·혈액",n:64,y:"",q:"대뇌동맥고리(윌리스 고리) 형성에 관여하는 혈관은?",a:"앞교통동맥(A-com), 앞대뇌동맥(ACA), 중간대뇌동맥(MCA), 뒤교통동맥(P-com), 뒤대뇌동맥(PCA), 뇌바닥동맥(basilar), 척추동맥(vertebral)"},
{id:"V09",cat:"혈관·혈액",n:65,y:"",q:"해면정맥굴(cavernous sinus)의 특징은?",a:"눈정맥 + 얼굴정맥 문합\n경질막 내에 있으며 뇌막염과 관련"},
{id:"V10",cat:"혈관·혈액",n:67,y:"",q:"작은두렁정맥과 큰두렁정맥은 어디와 결합하나?",a:"작은두렁정맥: 오금정맥과 결합\n큰두렁정맥: 넙다리정맥과 결합"},
{id:"V11",cat:"혈관·혈액",n:68,y:"",q:"림프액의 흐름과 가슴림프관·오른림프관이 나오는 지점은?",a:"모세림프관 → 림프관(판막 존재) → 림프절 → 림프줄기(가슴림프관 & 오른림프관) → 혈관\n가슴림프관: 왼속목정맥과 왼빗장밑정맥이 만나는 곳\n오른림프관: 오른속목정맥과 오른빗장밑정맥이 만나는 곳(오른팔머리정맥)"},
{id:"V12",cat:"혈관·혈액",n:70,y:"",q:"혈장 단백질 3종은 각각 어디서 만들고 무슨 일을 하나?",a:"알부민(간): 삼투압, 산염기 평형, 운반체, 영양원\n글로불린: α·β(간), γ(면역글로불린, 림프구)\n피브리노겐(간): 혈액응고\n(적혈구 단백질 = 헤모글로빈)"},
{id:"V13",cat:"혈관·혈액",n:73,y:"",q:"용혈(빌리루빈)은 무엇이고, 헤모글로빈 합성에 필요한 물질은?",a:"용혈: 적혈구가 파괴되어 헤모글로빈이 빠져나오는 것\n헤모글로빈 합성: 철(Fe)"},
{id:"V14",cat:"혈관·혈액",n:76,y:"",q:"피브린을 다시 녹이는 물질은?",a:"플라스민(plasmin, 혈전용해제)"},
{id:"V15",cat:"혈관·혈액",n:77,y:"",q:"노쪽피부정맥, 자쪽피부정맥, 팔오금중간정맥, 안쪽아래팔정맥의 공통점은?",a:"가장 피부표면에 위치, 채혈 자리(정맥주사)"},
{id:"V16",cat:"혈관·혈액",n:78,y:"",q:"림프조직이 잘 발달한 곳(림프기관)은?",a:"림프절, 지라, 가슴샘, 편도, 림프관"},
{id:"V17",cat:"혈관·혈액",n:79,y:"",q:"심장박출량은 어떻게 계산하나?",a:"1회 박동량(70ml) × 1분 박동수(70회) = 약 5L"},
{id:"V18",cat:"혈관·혈액",n:80,y:"",q:"1회 박동량을 증가시키는 인자는?",a:"교감신경(아드레날린, 에피네프린, 노르에피네프린)\n스탈링 법칙: 심장근육의 길이와 수출량(박동량)은 비례"},
{id:"V19",cat:"혈관·혈액",n:81,y:"",q:"1분 박동수를 증가시키는 인자는?",a:"교감신경\n높은 온도(굴심방결절에 영향)\n이산화탄소량이 높을 때"},
{id:"V20",cat:"혈관·혈액",n:84,y:"",q:"압력수용기 심장반사(대동맥활·목동맥팽대)는 어떻게 일어나나?",a:"혈압상승 → 압력수용기 흥분 → 말초신경 → 심장중추(숨뇌) → 자율신경(부교감) → 심장기능 저하 → 혈압 감소"},
{id:"V21",cat:"혈관·혈액",n:84,y:"",q:"화학수용기 반사(대동맥토리·목동맥토리)는 어떻게 일어나나?",a:"혈중 산소 감소·이산화탄소 증가 → 화학수용기 흥분 → 말초신경 → 심장중추(숨뇌) → 자율신경(교감) → 심장기능 촉진 → 혈압 상승"},
{id:"V22",cat:"혈관·혈액",n:84,y:"",q:"Brain bridge 반사(= Starling 법칙)와 관련된 곳은?",a:"오른심장, 위대정맥"},
{id:"N01",cat:"신경·뇌",n:85,y:"",q:"중추신경계와 말초신경계의 구성은?",a:"중추(CNS): 뇌, 척수\n말초(PNS): 감각신경(체간·장기), 운동신경(체신경, 자율신경 = 교감·부교감)"},
{id:"N02",cat:"신경·뇌",n:86,y:"",q:"말이집신경섬유의 특징과 중추에서 말이집을 만드는 세포는?",a:"민말이집보다 전도속도가 빠름\n희소돌기아교세포: 중추신경계에서 말이집을 형성"},
{id:"N03",cat:"신경·뇌",n:87,y:"",q:"신경아교세포, 미세아교세포의 역할은?",a:"신경아교세포: 신경세포 보호와 지지\n미세아교세포: 신경조직 중 유일한 중배엽성 기원 세포(식세포)"},
{id:"N04",cat:"신경·뇌",n:89,y:"",q:"신경억제물질은?",a:"GABA, glycine"},
{id:"N05",cat:"신경·뇌",n:90,y:"",q:"뇌척수막 3겹을 바깥에서 안으로 말하면?",a:"경질막 - 거미막 - 연질막\n(CT와 연계되는 부분)"},
{id:"N06",cat:"신경·뇌",n:91,y:"",q:"뇌척수액(CSF)의 순환 경로는?",a:"맥락얼기 → 가쪽뇌실 → 실간공 → 제3뇌실 → 중뇌수도 → 제4뇌실 → 루슈카공/마장디공 → 거미막밑강 → 상시상정맥동 거미막융모 → 정맥혈"},
{id:"N07",cat:"신경·뇌",n:92,y:"",q:"뇌척수액을 생산하는 곳은?",a:"맥락얼기(뇌실에서만 볼 수 있음)"},
{id:"N08",cat:"신경·뇌",n:93,y:"",q:"뇌척수액 검사를 위한 허리뼈 천자는 어디에 하나?",a:"L3~L4 높이(척수는 L1~L2에서 끝나기 때문에 안전)\n거미막밑 공간까지 천자"},
{id:"N09",cat:"신경·뇌",n:101,y:"",q:"Bell-Magendie 법칙은?",a:"뒤뿌리: 감각신경\n앞뿌리: 운동신경"},
{id:"N10",cat:"신경·뇌",n:102,y:"",q:"척수에서 두 군데 굵어진 부분(팽대부)은?",a:"목팽대, 허리팽대"},
{id:"N11",cat:"신경·뇌",n:103,y:"",q:"뇌하수체가 위치하고 시각신경교차가 이루어지며 신체 항상성을 유지하는 곳은?",a:"시상하부"},
{id:"N12",cat:"신경·뇌",n:104,y:"",q:"신체평형을 유지하는 뇌는?",a:"소뇌\n(몸의 자세와 균형이 흐트러지면 속귀 반고리뼈관에서 흥분파를 보냄)"},
{id:"N13",cat:"신경·뇌",n:106,y:"",q:"시상, 멜라토닌, 시각신경교차, 뇌하수체를 볼 수 있는 뇌는?",a:"사이뇌"},
{id:"N14",cat:"신경·뇌",n:107,y:"",q:"뇌줄기(Brain stem)를 이루는 3부분은?",a:"중간뇌 · 다리뇌(대뇌반구에서 소뇌로 중계) · 숨뇌"},
{id:"N15",cat:"신경·뇌",n:108,y:"",q:"뇌신경은 몇 개이고, 척수신경은 몇 쌍인가?",a:"뇌신경 12쌍, 척수신경 31쌍\n(부교감 성분: 3, 7, 9, 10번)"},
{id:"N16",cat:"신경·뇌",n:109,y:"",q:"안구운동에 관여하는 뇌신경 3개는?",a:"눈돌림신경, 도르래신경, 갓돌림신경"},
{id:"N17",cat:"신경·뇌",n:110,y:"",q:"혀 앞 2/3 미각과 혀밑샘·턱밑샘 분비를 맡는 신경은?",a:"얼굴신경(부교감)"},
{id:"N18",cat:"신경·뇌",n:111,y:"",q:"혀 뒤 1/3 미각과 귀밑샘 분비를 맡는 신경은?",a:"혀인두신경(부교감)"},
{id:"N19",cat:"신경·뇌",n:112,y:"",q:"척수신경의 종류와 신경얼기, 종말지는?",a:"목신경(8쌍): 목신경얼기(가로막신경), 팔신경얼기(겨드랑신경, 근육피부신경, 정중신경, 자신경, 노신경)\n허리신경(5쌍): 허리신경얼기\n엉치신경(5쌍): 엉치신경얼기(궁둥신경 = 정강신경+온종아리신경, 인체 최대 신경)\n꼬리신경(1쌍): 꼬리신경얼기\n가슴신경(12쌍): 신경얼기 없음"},
{id:"D01",cat:"소화",n:114,y:"",q:"소화관의 종류와 경로는?",a:"입 → 인두 → 식도 → 위 → 12지장 → 소장 → 대장 → 항문"},
{id:"D02",cat:"소화",n:115,y:"",q:"소화부속기관은?",a:"혀 · 치아 · 침샘 · 간 · 담낭 · 췌장"},
{id:"D03",cat:"소화",n:116,y:"",q:"침샘(타액선)의 종류와 특징은?",a:"침에서 프티알린(탄수화물 소화효소) 분비\n귀밑샘: 가장 큰 샘, 장액분비, 볼거리(mumps)가 주로 발생\n턱밑샘: 장액분비 > 점액분비\n혀밑샘: 장액분비 < 점액분비"},
{id:"D04",cat:"소화",n:118,y:"",q:"분계고랑 앞에 평행하게 있고 맛봉오리가 발달한 가장 큰 혀유두는?",a:"성곽유두"},
{id:"D05",cat:"소화",n:119,y:"",q:"식도와 위가 연결되는 부분은?",a:"들문(cardia)"},
{id:"D06",cat:"소화",n:121,y:"",q:"간에서 프로트롬빈(혈액응고인자) 생산 시 필요한 비타민은?",a:"비타민 K"},
{id:"D07",cat:"소화",n:122,y:"",q:"간의 실질조직(가장 작은 단위)은 무엇이고, 그 구성은?",a:"간소엽\n중심정맥, 굴모세혈관(간내모세혈관), 간세포(쓸개즙 생산)"},
{id:"D08",cat:"소화",n:123,y:"",q:"간을 왼엽과 오른엽으로 구분하는 것은?",a:"낫인대(falciform ligament)"},
{id:"D09",cat:"소화",n:124,y:"",q:"간의 기능은?",a:"재생력, 쓸개즙 형성, 해독작용, 단백질 합성, 단백질 대사, 당합성 & 분해, 철분과 비타민 저장, 감마글로불린(면역글로불린)"},
{id:"D10",cat:"소화",n:126,y:"",q:"중층편평상피조직으로 되어 있는 기관은?",a:"입안, 인두, 식도, 항문"},
{id:"D11",cat:"소화",n:127,y:"",q:"소화기관의 대부분을 지배하는 신경은?",a:"미주신경"},
{id:"D12",cat:"소화",n:128,y:"",q:"소화관의 벽 구조를 바깥쪽에서 안쪽으로 말하면?",a:"장막층 → 근육층 → 점막밑층 → 점막층"},
{id:"D13",cat:"소화",n:129,y:"",q:"쓸개즙의 구성 요소는? 소화효소가 있나?",a:"쓸개즙색소, 쓸개즙산염, 콜레스테롤, 무기염, 전해질\n소화효소는 아님"},
{id:"D14",cat:"소화",n:130,y:"",q:"복막뒤 기관(후복막 기관)은?",a:"이자, 콩팥, 요관, 부신, 배대동맥, 아래대정맥, 가슴림프관, 샘창자, 큰창자의 오름·내림 잘록창자"},
{id:"D15",cat:"소화",n:131,y:"",q:"치질이 호발하는 부위는?",a:"치핵지대(곧창자 아래부분)"},
{id:"D16",cat:"소화",n:132,y:"",q:"음식물이 기도로 넘어가지 않도록 하는 구조물은?",a:"후두덮개"},
{id:"D17",cat:"소화",n:133,y:"",q:"작은창자의 림프조직은?",a:"무리림프소절(돌창자), 홑림프소절(빈창자)"},
{id:"D18",cat:"소화",n:134,y:"",q:"작은창자의 구조와 연결 순서는?",a:"십이지장(duodenum) → 공장(Jejunum, 홑림프소절 분포) → 회장(Ileum, 무리림프소절 분포)"},
{id:"D19",cat:"소화",n:137,y:"",q:"작은창자 융모의 기능과, 같은 위치·기능으로 발달한 림프조직은?",a:"영양분 흡수\n융모와 같은 기능·같은 위치에 발달: 홑림프소절"},
{id:"D20",cat:"소화",n:138,y:"",q:"작은창자에서 수용성 물질과 지용성 물질은 어떻게 흡수되고 어디로 가나?",a:"수용성(단당류, 아미노산, 무기염류, 비타민 B·C): 융모 → 문맥 → 간 → 간정맥 → 아래대정맥 → 우심방\n지용성(지방산, 글리세롤, 비타민 A·D·E·K): 작은창자림프관 → 암죽관 → 가슴림프관 → 팔머리정맥 → 위대정맥 → 우심방"},
{id:"D21",cat:"소화",n:139,y:"",q:"3대 영양소의 최종 분해산물과 흡수는?",a:"단백질 → 아미노산(최종, 새 조직 형성·유지에 사용)\n지방 → 글리세롤 & 지방산(가슴림프관 팽대에서 흡수되어 림프액 성분이 됨)\n탄수화물 → 포도당"},
{id:"D22",cat:"소화",n:140,y:"",q:"가스트린, 세크레틴, CCK의 분비 장소와 기능은?",a:"gastrin: 위, 위액분비 촉진\nsecretin: 샘창자, 쓸개즙·이자액 분비 촉진\nCCK(cholecystokinin): 샘창자, 쓸개수축·이자액 분비 촉진\n세크레틴·CCK의 공통점: 위의 운동 억제"},
{id:"D23",cat:"소화",n:141,y:"",q:"온쓸개관(CBD)과 이자관이 열리는 곳은?",a:"큰샘창자유두(= Vater 팽대부)\n샘창자(duodenum) 내림부(descending)에 위치"},
{id:"D24",cat:"소화",n:142,y:"",q:"기초대사율(BMR)이란?",a:"생명을 유지하는 데 필요한 최소 수준의 에너지를 1제곱미터 체표면적으로 환산하여 1시간 동안 발생한 열량(Kcal/㎡/시간)"},
{id:"D25",cat:"소화",n:143,y:"",q:"기초대사율에 영향을 미치는 요인은?",a:"연령(↓), 체온(↑), 약물(카페인·니코틴 등), 정서상태(흥분 시), 성별(남), 호르몬(갑상샘호르몬=티록신), 활동(↑), 감염이나 질병(걸렸을 때)"},
{id:"R01",cat:"호흡·비뇨",n:145,y:"",q:"허파문이란?",a:"허파 주변을 싸고 있는 막이 없는 부분\n기관지, 허파동맥, 허파정맥이 통행"},
{id:"R02",cat:"호흡·비뇨",n:147,y:"",q:"호흡속도에 가장 큰 영향을 미치는 요인은? 호흡이 촉진되는 경우는?",a:"가장 큰 요인: 이산화탄소\n촉진: 혈액 속 pH가 낮을 때\n허파환기량에 가장 큰 영향: 혈액 이산화탄소 함유량\n호흡중추: 숨뇌"},
{id:"R03",cat:"호흡·비뇨",n:151,y:"",q:"허파에서 일어나는 가스교환의 원리는?",a:"분압차이에 의한 확산"},
{id:"R04",cat:"호흡·비뇨",n:154,y:"",q:"산염기 평형을 담당하는 기관은?",a:"허파(폐), 콩팥(신장)"},
{id:"R05",cat:"호흡·비뇨",n:156,y:"",q:"소변 이동통로는?",a:"콩팥(Kidney) → 요관(Ureter) → 방광(Bladder) → 요도(Urethra)"},
{id:"R06",cat:"호흡·비뇨",n:158,y:"",q:"남성 요도를 방광 쪽부터 순서대로 나누면?",a:"전립샘부 요도(prostatic) → 막성부 요도(membranous, 중간) → 해면체 요도(cavernous, 요도 쪽)"},
{id:"R07",cat:"호흡·비뇨",n:160,y:"",q:"콩팥의 형태학적 단위(콩팥단위)는 무엇으로 구성되나?",a:"콩팥소체: 토리 + 토리주머니\n세관: 토리쪽 곱슬세관 → 콩팥세관고리 → 먼쪽 곱슬세관 → 집합세관"},
{id:"R08",cat:"호흡·비뇨",n:162,y:"",q:"혈압 저하 시 혈압을 올리기 위해 토리곁장치에서 분비되는 물질은?",a:"레닌"},
{id:"R09",cat:"호흡·비뇨",n:163,y:"",q:"토리쪽 곱슬세관에서 재흡수되고 먼쪽 곱슬세관에서 재분비되는 물질은?",a:"칼륨(K⁺)"},
{id:"R10",cat:"호흡·비뇨",n:164,y:"",q:"토리에서 여과는 되지만 콩팥세관에서 재흡수되지 않는 물질은?",a:"크레아티닌(Creatinine)"},
{id:"H01",cat:"생식·호르몬",n:168,y:"",q:"남성호르몬은 어디서 분비하고, 정자생성은 어디서 일어나나?",a:"고환(사이질세포) → 테스토스테론\n정세관 → 정자생성"},
{id:"H02",cat:"생식·호르몬",n:169,y:"",q:"방광 아래에 위치하며 분비물로 정자의 운동을 촉진시키는 것은?",a:"전립선(전립샘)"},
{id:"H03",cat:"생식·호르몬",n:170,y:"",q:"고환동맥과 난소동맥이 갈라지는 혈관은?",a:"배대동맥(Abdominal aorta)"},
{id:"H04",cat:"생식·호르몬",n:171,y:"",q:"전립선을 관통하는 것은? 전립선을 통과하여 요도에 열리는 짧은 관은?",a:"관통: 요도(Urethra)\n요도에 열리는 짧은 관: 사정관\n전립샘은 후복막장기로, 요도가 관통하는 밤알 모양의 부속생식기관"},
{id:"H05",cat:"생식·호르몬",n:173,y:"",q:"호르몬의 특성은?",a:"관을 통한 분비가 아니다(내분비)\n성장·발육 조절 표관기관이 있다\n과다·과소 발육 시에는 해가 된다"},
{id:"H06",cat:"생식·호르몬",n:174,y:"21",q:"자궁내막 증식과 자궁내막을 두껍게 만드는 호르몬은 각각 무엇인가?",a:"자궁내막 증식·재생: 에스트로겐\n자궁내막을 두껍게 만듦(생성된 내막을 유지): 프로게스테론"},
{id:"H07",cat:"생식·호르몬",n:176,y:"",q:"자궁속막의 표층과 깊은층은 각각 무엇이고 어떤 일을 하나?",a:"점막층 표층: 기능층(치밀층+해면층) → 월경 시 탈락\n점막층 깊은층: 바닥층 → 재생에 관여"},
{id:"H08",cat:"생식·호르몬",n:179,y:"",q:"갑상샘기능 항진증과 저하증의 증상은?",a:"항진증: 바세도우병(기초대사율 증진, 안구돌출증, 갑상샘종) → 방사선으로 치료\n저하증: 점액수종 → 방사선에 의한 장해"},
{id:"H09",cat:"생식·호르몬",n:181,y:"",q:"부갑상샘 기능 항진증과 저하증에서 생기는 병은?",a:"항진증: 골연화현상\n저하증: 저칼슘혈증, 테타니병"},
{id:"H10b",cat:"생식·호르몬",n:184,y:"",q:"부신겉질 기능 항진증과 저하증에서 생기는 병은?",a:"항진증: 쿠싱증후군(cortisol 관련)\n저하증: 에디슨병"},
{id:"S08",cat:"감각",n:186,y:"",q:"표피(4~5층)를 바깥부터 순서대로 말하면? 멜라닌이 있는 층은?",a:"각질층 → 투명층 → 과립층 → 가시층 → 바닥층\n바닥층(= 종자층): 피부색을 결정하는 멜라닌 색소가 들어 있음"},
{id:"S09",cat:"감각",n:187,y:"",q:"피부감각 수용기와 담당 감각은?",a:"자유신경종말: 통각\n루피니소체: 온각\n마이너스소체: 촉각\n크라우제끝망울: 냉각\n파치니소체: 압각"},
{id:"S10",cat:"감각",n:188,y:"",q:"감각수용기 중 가장 많은 수를 가진 것은?",a:"통점(통각)"},
{id:"S11",cat:"감각",n:189,y:"",q:"중이와 인두를 연결하는 관은?",a:"귀인두관(유스타키오관)\n중이 – 유스타키오관 – 코인두"},
{id:"S12",cat:"감각",n:192,y:"",q:"안구의 부속기관은?",a:"결막, 눈꺼풀, 눈물샘"},
{id:"S13",cat:"감각",n:194,y:"",q:"막대세포와 원뿔세포는 각각 어떤 빛을 감지하고 어떤 단백질을 가지나?",a:"막대세포(암순응, rod): rhodopsin 단백질, 명암 구분, 비타민 A와 관계, 야맹증과 관계\n원뿔세포(명순응, cone): iodopsin 단백질, 색 구분"},
{id:"S14",cat:"감각",n:195,y:"",q:"안구에서 빛이 통과해 들어오는 순서는?",a:"각막 → 안방수 → 수정체 → 유리체 → 망막"},
{id:"R11",cat:"호흡·비뇨",n:196,y:"",q:"호흡상(RQ)이란?",a:"CO₂ 배출량 / O₂ 흡입량 비(CO₂/O₂)"},
{id:"D26",cat:"소화",n:197,y:"",q:"우리 몸의 에너지원 사용 순서는?",a:"탄수화물 → 지방 → 단백질"},
{id:"R12b",cat:"호흡·비뇨",n:198,y:"",q:"성대가 부착되어 있어 발성에 관여하는 후두연골은?",a:"모뿔연골"},
{id:"N20",cat:"신경·뇌",n:199,y:"",q:"대뇌겉질 영역 중 시각을 담당하는 중추가 있는 곳은?",a:"뒤통수엽"},
{id:"V23",cat:"혈관·혈액",n:200,y:"",q:"적색골수의 기능장애로 올 수 있는 빈혈은?",a:"재생불량성 빈혈"},
{id:"N21",cat:"신경·뇌",n:201,y:"",q:"각성 시(낮에 활동할 때) 정상적인 뇌파는?",a:"베타파"},
{id:"N22",cat:"신경·뇌",n:202,y:"",q:"교재에서 '수면 시(밤에 안정된 상태일 때)' 정상 뇌파로 적은 것은?",a:"알파파(주파수 8~13Hz)",note:"확인 필요: 스누국시 202번에는 이렇게 적혀 있어요. 일반적으로 알파파는 눈을 감고 편안히 깨어 있을 때 나오고, 수면 중에는 세타파·델타파가 나온다고 알려져 있어요. 시험 보기에 알파파와 델타파가 같이 있으면 기준을 확인하세요."},
{id:"R13b",cat:"호흡·비뇨",n:203,y:"",q:"총폐활량은 어떻게 구하고, 잔기용량이란?",a:"총폐활량 = 폐활량 + 잔기용량\n잔기용량: 폐에 있는 공기 외에 공기통로에 남아 있는 용량"},
{id:"D27",cat:"소화",n:204,y:"",q:"쓸개즙 성분 중 가장 많고 지방의 소화를 촉진하는 성분은?",a:"쓸개즙염"},
{id:"S15",cat:"감각",n:205,y:"",q:"진피의 표층이며 손·발바닥의 지문을 형성하는 층은?",a:"유두층"},
{id:"D28",cat:"소화",n:206,y:"",q:"위 몸통과 날문을 경계 짓는 곳이며 위궤양의 호발 부위는?",a:"모패임"},

R17:["산소분압","이산화탄소분압","수증기압","대기압"],
M21:["모세혈관의 분포가 많다","미오글로빈이 많다","미토콘드리아가 많다","지구력 운동에 적합하다"],
V26:["다운증후군","패혈증","동맥관개존증","백혈병"],
S18:["비타민 D","비타민 E","비타민 K","비타민 C"],
R18:["등뼈 2번 높이(T2)","등뼈 10번 높이(T10)","목뼈 6번 높이(C6)","허리뼈 1번 높이(L1)"],
H14:["난관","자궁","질","뇌하수체"]
};


var DAY=86400000, INTERVALS=[0,1,3,7], EXAM_DAY=Math.floor(Date.UTC(2026,11,19)/DAY), REVIEW_CAP=30;
var state={}, prefs={cats:[],newLimit:25,lastStudy:null};
var queue=[], idx=0, revealed=false, chosen=null, right=0, wrong=0, lastWrongIds=[], sessionType="";

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];});}
function lines(s){return s.split("\n").map(function(l){return "<p>"+esc(l)+"</p>";}).join("");}
function today(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/DAY);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ago(d){var n=today()-d;return n<=0?"오늘":(n===1?"어제":n+"일 전");}

function load(){
  try{var s=localStorage.getItem("hbs-state-v1");if(s){state=JSON.parse(s)||{};}}catch(e){}
  try{var p=localStorage.getItem("hbs-prefs-v1");if(p){var o=JSON.parse(p)||{};
    prefs.cats=Array.isArray(o.cats)?o.cats:[];
    prefs.newLimit=([15,25,40,999].indexOf(o.newLimit)>=0)?o.newLimit:25;
    prefs.lastStudy=(typeof o.lastStudy==="number")?o.lastStudy:null;}}catch(e){}
  Object.keys(state).forEach(function(k){var s=state[k];if(s.box>3){s.box=3;}if(s.first==null){s.first=s.due;}});
}
function save(){
  try{localStorage.setItem("hbs-state-v1",JSON.stringify(state));localStorage.setItem("hbs-prefs-v1",JSON.stringify(prefs));}catch(e){}
}
function inScope(c){return prefs.cats.length===0||prefs.cats.indexOf(c.cat)>=0;}
function isMcq(c){return !!D[c.id];}
function mcqOptions(c){return shuffle(D[c.id].concat([c.a]));}

function show(which){
  ["home","study","done"].forEach(function(id){$(id).hidden=(id!==which);});
  window.scrollTo(0,0);
}

function buildChips(){
  var box=$("chips");box.innerHTML="";
  CATS.forEach(function(cat){
    var n=CARDS.filter(function(c){return c.cat===cat;}).length;
    var b=document.createElement("button");
    b.type="button";b.className="chip";b.textContent=cat+" "+n;
    b.setAttribute("aria-pressed",prefs.cats.indexOf(cat)>=0?"true":"false");
    b.addEventListener("click",function(){
      var i=prefs.cats.indexOf(cat);
      if(i>=0){prefs.cats.splice(i,1);}else{prefs.cats.push(cat);}
      save();buildChips();renderHome();
    });
    box.appendChild(b);
  });
}

function seenCards(){return CARDS.filter(function(c){return inScope(c)&&state[c.id];});}
function dueCards(){var t=today();return seenCards().filter(function(c){return state[c.id].due<=t;}).sort(function(a,b){return state[a.id].due-state[b.id].due;});}
function wrongCards(){return seenCards().filter(function(c){return state[c.id].wrong;});}
function newCards(){
  var t=today();
  var learnedToday=CARDS.filter(function(c){return state[c.id]&&state[c.id].first===t;}).length;
  var left=prefs.newLimit>=999?99999:Math.max(0,prefs.newLimit-learnedToday);
  return CARDS.filter(function(c){return inScope(c)&&!state[c.id];}).slice(0,left);
}
function examCards(){return seenCards().filter(isMcq);}

function renderHome(){
  var t=today(),due=dueCards(),nw=newCards(),wr=wrongCards(),ex=examCards();
  var dd=EXAM_DAY-t;
  $("dday").textContent=dd>0?("국시까지 "+dd+"일"):(dd===0?"오늘이 국시":"");
  $("n-due").textContent=due.length;
  $("n-new").textContent=nw.length;
  $("n-wrong").textContent=wr.length;
  var sc=CARDS.filter(inScope);
  $("subline").textContent="스누국시 해부생리학 전체 "+CARDS.length+"장 · 외운 카드 "+seenCards().length+"장 / 지금 범위 "+sc.length+"장";
  var li="아직 학습 기록이 없어요. 새로 외우기부터 시작해요.";
  if(prefs.lastStudy!=null){
    li="마지막으로 푼 날: "+ago(prefs.lastStudy);
    var late=due.filter(function(c){return state[c.id].due<t;}).length;
    if(late>0){li+=" · 밀린 복습 "+late+"장";}
  }
  $("lastinfo").textContent=li;
  $("newlimit").value=String(prefs.newLimit);
  function setb(id,label,n,minN){var b=$(id);b.innerHTML=label+(n!=null?"<small>"+n+"장</small>":"");b.disabled=n!=null&&n<(minN||1);}
  setb("b-new","새로 외우기",nw.length);
  setb("b-review","복습",Math.min(due.length,REVIEW_CAP));
  setb("b-wrong","틀린 카드",wr.length);
  setb("b-exam","확인 시험 (5지선다)",Math.min(ex.length,20),5);
  setb("b-final","전체 섞어서 마무리 복습",seenCards().length);
  var m="";
  if(due.length>REVIEW_CAP){m="복습이 "+due.length+"장 밀려 있어서 오래된 것부터 "+REVIEW_CAP+"장씩 나눠서 해요.";}
  else if(ex.length<5){m="확인 시험은 카드로 본 단답형 카드가 5장 이상 모이면 열려요.";}
  $("homemsg").textContent=m;
}

function groupLearn(cards){
  var out=[];
  for(var i=0;i<cards.length;i+=5){
    var g=cards.slice(i,i+5);
    g.forEach(function(c){out.push({c:c,learn:true});});
    shuffle(g).forEach(function(c){out.push({c:c,learn:false});});
  }
  return out;
}
function Q(c){return {c:c,learn:false};}

function startStudy(type,list){
  sessionType=type;queue=list;
  if(queue.length===0){return;}
  idx=0;right=0;wrong=0;lastWrongIds=[];
  show("study");showCard();
}
function startNew(){startStudy("new",groupLearn(newCards()));}
function startReview(){startStudy("review",dueCards().slice(0,REVIEW_CAP).map(Q));}
function startWrong(){startStudy("wrong",groupLearn(shuffle(wrongCards())));}
function startFinal(){startStudy("final",shuffle(seenCards()).map(Q));}
function startExam(){startStudy("exam",shuffle(examCards()).slice(0,20).map(Q));}

function showCard(){
  if(idx>=queue.length){finish();return;}
  var it=queue[idx],c=it.c,s=state[c.id];
  revealed=false;chosen=null;
  $("qmeta").textContent=c.cat+" · "+(c.y?("기출 "+c.y):"기출 표시 없음")+" · 자료 "+c.n+"번";
  $("qtext").textContent=c.q;
  var box=$("choices");box.innerHTML="";box.hidden=true;
  $("grade").hidden=true;$("badge").hidden=true;
  $("hist").textContent=s?("처음 본 날 "+ago(s.first)+" · 맞힌 횟수 "+(s.hits||0)+(s.last!=null?" · 마지막으로 맞힌 날 "+ago(s.last):"")):"";
  if(it.learn){
    $("badge").hidden=false;
    $("badge").textContent=it.retry?"틀렸어요 · 다시 읽고 외우기":"읽고 외우기";
    $("atext").innerHTML=lines(c.a);
    if(c.note){$("note").hidden=false;$("note").textContent=c.note;}else{$("note").hidden=true;}
    $("awrap").hidden=false;
    $("reveal").hidden=false;$("reveal").textContent="외웠어, 다음";
  }else if(sessionType==="exam"){
    $("awrap").hidden=true;
    box.hidden=false;$("reveal").hidden=true;$("reveal").textContent="다음";
    mcqOptions(c).forEach(function(t,i){
      var b=document.createElement("button");b.type="button";b.className="choice";
      b.textContent=(i+1)+". "+t;b.setAttribute("data-t",t);
      b.addEventListener("click",function(){pick(b,t);});
      box.appendChild(b);
    });
  }else{
    $("awrap").hidden=true;
    $("reveal").hidden=false;$("reveal").textContent="정답 보기";
  }
  $("barfill").style.width=Math.round(idx/queue.length*100)+"%";
  $("count").textContent=(idx+1)+" / "+queue.length;
}

function showAnswer(c){
  $("atext").innerHTML=lines(c.a);
  if(c.note){$("note").hidden=false;$("note").textContent=c.note;}else{$("note").hidden=true;}
  $("awrap").hidden=false;
}

function pick(btn,t){
  if(chosen!==null||idx>=queue.length){return;}
  var c=queue[idx].c;
  chosen=(t===c.a);
  var kids=$("choices").children;
  for(var i=0;i<kids.length;i++){
    kids[i].disabled=true;
    if(kids[i].getAttribute("data-t")===c.a){kids[i].classList.add("ok");}
  }
  if(!chosen){btn.classList.add("no");}
  revealed=true;showAnswer(c);
  $("reveal").hidden=false;
}

function touch(){prefs.lastStudy=today();}

function examResult(ok){
  var c=queue[idx].c,t=today(),s=state[c.id];
  if(ok){right++;}
  else{
    wrong++;
    if(lastWrongIds.indexOf(c.id)<0){lastWrongIds.push(c.id);}
    s.wrong=true;s.box=0;s.due=Math.min(s.due,t+1);
  }
  touch();save();idx++;showCard();
}

function reveal(){
  if(idx>=queue.length){return;}
  var it=queue[idx];
  if(it.learn){idx++;showCard();return;}
  if(sessionType==="exam"){if(chosen!==null){examResult(chosen);}return;}
  if(revealed){return;}
  revealed=true;showAnswer(it.c);
  $("reveal").hidden=true;$("grade").hidden=false;
}

function grade(ok){
  if(!revealed||idx>=queue.length||queue[idx].learn||sessionType==="exam"){return;}
  var it=queue[idx],c=it.c,t=today();
  if(it.retry){
    if(!ok){
      queue.splice(idx+1,0,{c:c,learn:true,retry:true});
      queue.splice(Math.min(idx+5,queue.length),0,{c:c,learn:false,retry:true});
    }
    idx++;showCard();return;
  }
  var s=state[c.id]||{box:0,due:t,wrong:false,hits:0,first:t,last:null};
  if(ok){
    s.box=Math.min((s.box||0)+1,3);
    s.due=t+INTERVALS[s.box];
    s.wrong=false;s.hits=(s.hits||0)+1;s.last=t;
    right++;
  }else{
    s.box=0;s.due=t+1;s.wrong=true;
    wrong++;
    if(lastWrongIds.indexOf(c.id)<0){lastWrongIds.push(c.id);}
    queue.splice(idx+1,0,{c:c,learn:true,retry:true});
    queue.splice(Math.min(idx+5,queue.length),0,{c:c,learn:false,retry:true});
  }
  state[c.id]=s;touch();save();
  idx++;showCard();
}

function finish(){
  $("s-right").textContent=right;
  $("s-wrong").textContent=wrong;
  $("donebig").textContent=right+" / "+(right+wrong);
  $("donetitle").textContent=sessionType==="exam"?"확인 시험 끝":"세션 끝";
  $("donemsg").textContent=wrong>0?(sessionType==="exam"?"틀린 카드는 틀린 카드에 들어갔어요. 아래 버튼으로 바로 다시 외울 수 있어요.":"틀린 카드는 내일 복습에도 다시 나와요."):"모두 맞혔어요.";
  $("again-wrong").hidden=lastWrongIds.length===0;
  show("done");renderHome();
}

var resetArmed=false,resetTimer=null;
function resetClick(){
  var b=$("reset");
  if(!resetArmed){
    resetArmed=true;b.textContent="정말 지울까요? 한 번 더 누르면 모든 기록이 지워져요";
    resetTimer=setTimeout(function(){resetArmed=false;b.textContent="기록 지우기";},4000);
    return;
  }
  clearTimeout(resetTimer);resetArmed=false;b.textContent="기록 지우기";
  state={};prefs.lastStudy=null;save();renderHome();
}

function init(){
  load();buildChips();renderHome();
  $("b-new").addEventListener("click",startNew);
  $("b-review").addEventListener("click",startReview);
  $("b-wrong").addEventListener("click",startWrong);
  $("b-exam").addEventListener("click",startExam);
  $("b-final").addEventListener("click",startFinal);
  $("reveal").addEventListener("click",reveal);
  $("card").addEventListener("click",function(){if(idx<queue.length&&!queue[idx].learn&&sessionType!=="exam"&&!revealed){reveal();}});
  $("rightbtn").addEventListener("click",function(){grade(true);});
  $("wrongbtn").addEventListener("click",function(){grade(false);});
  $("quit").addEventListener("click",function(){renderHome();show("home");});
  $("gohome").addEventListener("click",function(){renderHome();show("home");});
  $("again-wrong").addEventListener("click",function(){
    var list=CARDS.filter(function(c){return lastWrongIds.indexOf(c.id)>=0;});
    startStudy("wrong",groupLearn(shuffle(list)));
  });
  $("newlimit").addEventListener("change",function(e){prefs.newLimit=parseInt(e.target.value,10)||25;save();renderHome();});
  $("reset").addEventListener("click",resetClick);
}
init();
</script>
</body>
</html>
